<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Sanaa Online Shop — Customer Panel"
    >

    <title>پنل مشتری | Sanaa</title>

    <!-- Persian Typeface: Vazirmatn -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003/Vazirmatn-font-face.css"
    >

    <!-- Main Stylesheet -->
    <link
        rel="stylesheet"
        href="../statics/css/main.css"
    >
</head>

<body>

    <!-- ========================================
         Customer Panel
    ========================================= -->

    <main
        class="customer-page"
        id="customerPage"
    >

        <div class="customer-page__container">

            <!-- Header -->

            <header class="customer-page__header">

                <h1 class="customer-page__brand" dir="ltr">
                    SANAA
                </h1>

                <button
                    type="button"
                    class="customer-page__logout"
                    data-logout
                    aria-label="خروج از حساب"
                >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

            </header>


            <!-- Card -->

            <section class="auth-card">

                <!-- Tabs -->

                <div
                    class="auth-tabs"
                    role="tablist"
                >

                    <button
                        type="button"
                        class="auth-tab is-active"
                        data-customer-tab="profile"
                        role="tab"
                        aria-selected="true"
                    >
                        اطلاعات من
                    </button>

                    <button
                        type="button"
                        class="auth-tab"
                        data-customer-tab="orders"
                        role="tab"
                        aria-selected="false"
                    >
                        سفارش‌ها
                    </button>

                </div>


                <div class="auth-content">

                    <!-- ==================================
                         Profile
                    =================================== -->

                    <section
                        class="customer-panel is-active"
                        data-customer-panel="profile"
                    >

                        <form
                            id="profileForm"
                            novalidate
                        >

                            <div
                                class="auth-form__alert"
                                data-form-alert
                                hidden
                            ></div>

                            <div class="form-group">

                                <label
                                    class="form-label"
                                    for="profilePhone"
                                >
                                    شماره تلفن
                                </label>

                                <input
                                    class="form-input"
                                    type="tel"
                                    id="profilePhone"
                                    name="phone"
                                    placeholder="۰۹xxxxxxxxx"
                                    autocomplete="tel"
                                    inputmode="tel"
                                    dir="ltr"
                                    required
                                >

                                <span
                                    class="form-error"
                                    id="profilePhoneError"
                                    role="alert"
                                ></span>

                            </div>


                            <div class="form-group">

                                <label
                                    class="form-label"
                                    for="profileAddress"
                                >
                                    آدرس
                                </label>

                                <textarea
                                    class="form-textarea"
                                    id="profileAddress"
                                    name="address"
                                    placeholder="آدرس خود را وارد کنید"
                                    autocomplete="street-address"
                                    required
                                ></textarea>

                                <span
                                    class="form-error"
                                    id="profileAddressError"
                                    role="alert"
                                ></span>

                            </div>


                            <button
                                type="submit"
                                class="auth-submit"
                            >
                                <span class="auth-submit__label">ذخیره تغییرات</span>
                                <svg class="auth-submit__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                                    <path d="M19 12H5M11 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>

                        </form>


                        <div
                            class="panel-divider"
                            aria-hidden="true"
                        ></div>


                        <h2 class="panel-subtitle">
                            تغییر رمز عبور
                        </h2>

                        <form
                            id="changePasswordForm"
                            novalidate
                        >

                            <div class="form-group">

                                <label
                                    class="form-label"
                                    for="oldPassword"
                                >
                                    رمز عبور فعلی
                                </label>

                                <div class="password-field">

                                    <input
                                        class="form-input"
                                        type="password"
                                        id="oldPassword"
                                        name="oldPassword"
                                        placeholder="رمز عبور فعلی خود را وارد کنید"
                                        autocomplete="current-password"
                                        required
                                    >

                                    <button
                                        type="button"
                                        class="password-toggle"
                                        data-password-toggle="oldPassword"
                                        aria-label="نمایش رمز عبور"
                                    >
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke-linecap="round" stroke-linejoin="round"/>
                                            <circle cx="12" cy="12" r="3" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </button>

                                </div>

                                <span
                                    class="form-error"
                                    id="oldPasswordError"
                                    role="alert"
                                ></span>

                            </div>


                            <div class="form-group">

                                <label
                                    class="form-label"
                                    for="newPassword"
                                >
                                    رمز عبور جدید
                                </label>

                                <div class="password-field">

                                    <input
                                        class="form-input"
                                        type="password"
                                        id="newPassword"
                                        name="newPassword"
                                        placeholder="رمز عبور جدید را وارد کنید"
                                        autocomplete="new-password"
                                        minlength="6"
                                        required
                                    >

                                    <button
                                        type="button"
                                        class="password-toggle"
                                        data-password-toggle="newPassword"
                                        aria-label="نمایش رمز عبور"
                                    >
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke-linecap="round" stroke-linejoin="round"/>
                                            <circle cx="12" cy="12" r="3" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </button>

                                </div>

                                <span
                                    class="form-error"
                                    id="newPasswordError"
                                    role="alert"
                                ></span>

                            </div>


                            <button
                                type="submit"
                                class="auth-submit"
                            >
                                <span class="auth-submit__label">تغییر رمز عبور</span>
                                <svg class="auth-submit__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                                    <path d="M19 12H5M11 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>

                        </form>

                    </section>


                    <!-- ==================================
                         Orders
                    =================================== -->

                    <section
                        class="customer-panel"
                        data-customer-panel="orders"
                    >

                        <ul
                            class="order-list"
                            id="orderList"
                        ></ul>

                        <p
                            class="order-empty"
                            id="orderEmpty"
                            hidden
                        >
                            هنوز سفارشی ثبت نکرده‌اید.
                        </p>

                    </section>

                </div>

            </section>

        </div>


        <!-- Order Invoice Modal -->

        <div
            class="modal"
            id="orderModal"
            hidden
        >

            <div
                class="modal__backdrop"
                data-modal-close
            ></div>

            <div
                class="modal__panel"
                role="dialog"
                aria-modal="true"
                aria-labelledby="orderModalTitle"
            >

                <button
                    type="button"
                    class="modal__close"
                    data-modal-close
                    aria-label="بستن"
                >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <path d="M18 6 6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <h2
                    class="modal__title"
                    id="orderModalTitle"
                ></h2>

                <div
                    class="modal__body"
                    id="orderModalBody"
                ></div>

            </div>

        </div>

    </main>


    <!-- JavaScript -->
    <script src="../statics/js/modules/storage.js" defer></script>
    <script src="../statics/js/modules/auth.js" defer></script>
    <script src="../statics/js/modules/customer.js" defer></script>
    <script src="../statics/js/modules/page-guard.js" defer></script>
    <script src="../statics/js/main.js" defer></script>

    <!-- Signed-out visitors get bounced straight back to login -->
    <script>
        document.addEventListener("DOMContentLoaded", () => requireCustomerAuth());
    </script>

</body>

</html>
