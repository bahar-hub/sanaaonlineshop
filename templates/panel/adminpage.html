{% load static %}

<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="Sanaa Online Shop - Admin Panel"
>

<title>Sanaa Admin</title>

<!-- Persian Typeface -->
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/vazirmatn@33.003/Vazirmatn-font-face.css"
>

<!-- Main Stylesheet -->
<link
    rel="stylesheet"
    href="{% static 'css/main.css' %}"
>
```

</head>

<body>

```
<!-- ========================================
     ADMIN PANEL
========================================= -->

<main
    class="admin-layout-f"
    id="adminPage"
>


    <!-- ========================================
         TOPBAR
    ========================================= -->

    <header class="admin-topbar-f">


        <!-- Brand -->

        <div
            class="admin-topbar-f__brand"
            dir="ltr"
        >
            SANAA <span>ADMIN</span>
        </div>


        <!-- Admin Logout Button -->
        <!-- ظاهر جدید Front-end، با حفظ data-logout برای Backend/JS -->

        <button
            type="button"
            class="admin-topbar-f__logout"
            id="adminLogoutBtnF"
            data-logout
            aria-label="خروج از حساب ادمین"
            title="خروج"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                aria-hidden="true"
            >

                <path
                    d="M10 5H6.5A1.5 1.5 0 0 0 5 6.5v11A1.5 1.5 0 0 0 6.5 19H10"
                />

                <path
                    d="M14 8l4 4-4 4"
                />

                <path
                    d="M18 12H9"
                />

            </svg>

            <span>
                خروج
            </span>

        </button>


    </header>



    <!-- ========================================
         ADMIN NAVIGATION
    ========================================= -->

    <nav
        class="admin-navigation-f"
        aria-label="بخش‌های پنل ادمین"
    >


        <!-- Orders -->

        <button
            type="button"
            class="admin-navigation-f__item"
            data-admin-nav-f="orders"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                aria-hidden="true"
            >

                <rect
                    x="4"
                    y="7"
                    width="16"
                    height="13"
                    rx="1.5"
                />

                <path
                    d="M8 7V5.5A2.5 2.5 0 0 1 10.5 3h3A2.5 2.5 0 0 1 16 5.5V7"
                />

            </svg>

            <span>
                سفارش‌ها
            </span>

        </button>



        <!-- Customers -->

        <button
            type="button"
            class="admin-navigation-f__item"
            data-admin-nav-f="customers"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                aria-hidden="true"
            >

                <circle
                    cx="12"
                    cy="8"
                    r="3.5"
                />

                <path
                    d="M4.5 20c1.2-3.6 4.2-5.5 7.5-5.5s6.3 1.9 7.5 5.5"
                />

            </svg>

            <span>
                مشتریان
            </span>

        </button>



        <!-- Reports -->

        <button
            type="button"
            class="admin-navigation-f__item"
            data-admin-nav-f="reports"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                aria-hidden="true"
            >

                <path
                    d="M4 20V10M11 20V4M18 20v-7"
                />

            </svg>

            <span>
                گزارش‌ها
            </span>

        </button>


    </nav>



    <!-- ========================================
         ADMIN WELCOME
    ========================================= -->

    <div class="admin-content-f">


        <section class="admin-welcome-f">


            <!-- Animated Icon -->

            <div
                class="admin-welcome-f__icon"
                aria-hidden="true"
            >

                <svg
                    viewBox="0 0 64 64"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <path
                        d="M32 7L37 26L57 32L37 38L32 57L27 38L7 32L27 26L32 7Z"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M49 8L51 15L58 17L51 19L49 26L47 19L40 17L47 15L49 8Z"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linejoin="round"
                    />

                </svg>

            </div>



            <!-- Small Brand Label -->

            <span class="admin-welcome-f__eyebrow">
                SANAA ADMIN
            </span>



            <!-- Main Welcome -->

            <h1 class="admin-welcome-f__title">
                خوش آمدید
            </h1>



            <!-- Description -->

            <p class="admin-welcome-f__description">
                از منوی بالا بخش مورد نظر خود را انتخاب کنید.
            </p>


        </section>


    </div>


</main>



<!-- ========================================
     JAVASCRIPT
========================================= -->


<script
    src="{% static 'js/modules/storage.js' %}"
    defer
></script>


<script
    src="{% static 'js/modules/auth.js' %}"
    defer
></script>


<script
    src="{% static 'js/modules/admin-panel-f.js' %}"
    defer
></script>
```

</body>

</html>
