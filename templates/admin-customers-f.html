<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Sanaa Online Shop — Admin Panel"
    >

    <title>مشتریان | Sanaa Admin</title>

    <!-- Main Stylesheet (unchanged — shared with the rest of the site) -->
    <link
        rel="stylesheet"
        href="../statics/css/main.css"
    >
</head>

<body>

    <div class="admin-layout-f">

        <!-- Topbar -->
        <header class="admin-topbar-f">
            <div class="admin-topbar-f__brand" dir="ltr">SANAA <span>ADMIN</span></div>
            <div class="admin-topbar-f__profile" aria-label="مدیر فروشگاه">ع.م</div>
        </header>

        <!-- Horizontal navigation tabs -->
        <nav class="admin-navigation-f" aria-label="بخش‌های پنل ادمین">

            <a href="admin-orders-f.html" class="admin-navigation-f__item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <rect x="4" y="7" width="16" height="13" rx="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M8 7V5.5A2.5 2.5 0 0 1 10.5 3h3A2.5 2.5 0 0 1 16 5.5V7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                سفارش‌ها
            </a>

            <a href="admin-customers-f.html" class="admin-navigation-f__item admin-navigation-f__item--active" aria-current="page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <circle cx="12" cy="8" r="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M4.5 20c1.2-3.6 4.2-5.5 7.5-5.5s6.3 1.9 7.5 5.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                مشتریان
            </a>

            

            <a href="admin-reports-f.html" class="admin-navigation-f__item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <path d="M4 20V10M11 20V4M18 20v-7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                گزارش‌ها
            </a>

        </nav>


        <!-- Content -->
        <div class="admin-content-f">

            <main class="admin-customers-f">

                <div class="admin-customers-f__header">
                    <h1 class="admin-customers-f__title">مشتریان</h1>

                    <button type="button" class="admin-btn-f" id="adminAddCustomerBtnF">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                            <path d="M12 5v14M5 12h14" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        افزودن مشتری
                    </button>
                </div>


                <!-- Toolbar: search + sort -->
                <div class="admin-customers-f__toolbar">

                    <div class="admin-search-f">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                            <circle cx="11" cy="11" r="7" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="m20 20-3.5-3.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <input
                            type="text"
                            class="admin-search-f__input"
                            id="adminCustomerSearchF"
                            placeholder="جستجوی نام، شماره موبایل یا شناسه مشتری"
                        >
                    </div>

                    <select class="admin-select-f" id="adminCustomerSortF" aria-label="مرتب‌سازی بر اساس">
                        <option value="newest">مرتب‌سازی: جدیدترین</option>
                        <option value="oldest">قدیمی‌ترین</option>
                        <option value="most-spent">بیشترین خرید</option>
                        <option value="most-orders">بیشترین سفارش</option>
                        <option value="name">نام (الفبا)</option>
                    </select>

                </div>


                <!-- Customer list -->
                <ul class="admin-customers-f__list" id="adminCustomersListF"></ul>

                <p class="admin-customers-f__empty" id="adminCustomersEmptyF" hidden>
                    مشتری‌ای با این مشخصات پیدا نشد.
                </p>

            </main>

        </div>

    </div>


    <!-- ============ Add customer modal ============ -->
    <!-- Reuses the shared .modal component from
         components/modal (same one used for the invoice
         popup in the storefront) -->

    <div class="modal" id="adminAddCustomerModalF" hidden>
        <div class="modal__backdrop"></div>

        <div class="modal__panel">
            <button type="button" class="modal__close" id="adminAddCustomerCloseF" aria-label="بستن">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <path d="M18 6 6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <h2 class="modal__title">افزودن مشتری جدید</h2>

            <form id="adminAddCustomerFormF" novalidate>

                <div class="admin-customers-f__form-group">
                    <label class="admin-customers-f__form-label" for="adminNewCustomerNameF">نام و نام خانوادگی</label>
                    <input type="text" class="admin-customers-f__form-input" id="adminNewCustomerNameF" placeholder="مثلاً سارا احمدی">
                    <p class="admin-customers-f__form-error">وارد کردن نام الزامی است.</p>
                </div>

                <div class="admin-customers-f__form-group">
                    <label class="admin-customers-f__form-label" for="adminNewCustomerPhoneF">شماره موبایل</label>
                    <input type="tel" class="admin-customers-f__form-input" id="adminNewCustomerPhoneF" placeholder="۰۹۱۲۳۴۵۶۷۸۹" dir="ltr">
                    <p class="admin-customers-f__form-error">وارد کردن شماره موبایل الزامی است.</p>
                </div>

                <div class="admin-customers-f__form-group">
                    <label class="admin-customers-f__form-label" for="adminNewCustomerEmailF">ایمیل (اختیاری)</label>
                    <input type="email" class="admin-customers-f__form-input" id="adminNewCustomerEmailF" placeholder="example@mail.com" dir="ltr">
                </div>

                <button type="submit" class="admin-btn-f admin-customers-f__form-submit">ثبت مشتری</button>

            </form>
        </div>
    </div>


    <!-- ============ Customer orders modal ============ -->
    <!-- Reuses .modal + the real .order-list / .order-card /
         .order-status classes from components/orders, so this
         looks identical to the storefront "سفارش‌های من" page. -->

    <div class="modal" id="adminCustomerOrdersModalF" hidden>
        <div class="modal__backdrop"></div>

        <div class="modal__panel">
            <button type="button" class="modal__close" id="adminCustomerOrdersCloseF" aria-label="بستن">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <path d="M18 6 6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <h2 class="modal__title" id="adminCustomerOrdersTitleF">سفارش‌های مشتری</h2>

            <p class="admin-customers-f__orders-summary" id="adminCustomerOrdersSummaryF"></p>

            <ul class="order-list" id="adminCustomerOrdersListF"></ul>

            <p class="order-empty" id="adminCustomerOrdersEmptyF" hidden>
                این مشتری تا امروز سفارشی ثبت نکرده است.
            </p>
        </div>
    </div>


    <script src="../statics/js/modules/admin-customers-f.js" defer></script>

</body>

</html>
